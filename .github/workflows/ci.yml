name: council-guard
on: [pull_request, push]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    # Developed on Linux; the Windows build was tested under Wine. Neither Windows nor macOS had run
    # on a real machine when this was written: until their first green run, a red job there is a
    # finding to fix, not a reason to block a merge. Then delete the next line.
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "rustfmt, clippy"}
      - uses: Swatinem/rust-cache@v2
      - name: Format and lints (once is enough)
        if: runner.os == 'Linux'
        run: cargo fmt --check && cargo clippy --all-targets -- -D warnings
      - name: Tests (unit, scenarios, security, surfaces, fuzzing, licence notices). No model is called
        run: cargo test --locked
      - name: What must stay fast (the limits hold on the optimised build)
        run: cargo test --locked --release --test speed -- --nocapture
      - name: A whole scripted council through the release binary
        run: cargo run --locked --release --quiet -- demo
      - name: The codebase map matches the code (refresh with `council map --packet`, or `--accept` if it still holds)
        run: cargo run --locked --release --quiet -- map --check
      - name: Model data freshness (warn only)
        if: runner.os == 'Linux'
        run: ./target/release/council refresh --check || echo "::warning::model data is stale - run council refresh"
  msrv:
    # Cargo.toml says rust-version 1.85: the oldest toolchain its dependencies allow, with the versions
    # in Cargo.lock (resolver 3 picks them to fit). Prove the build and the tests there.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
      - run: cargo test --locked
  audit:
    # The crates in Cargo.lock against the RustSec advisory database.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-audit --locked
      - run: cargo audit
  locks:
    # Copy this job into product repos: it enforces locked tests below the agent, for every tool.
    # The manifest is read from the BASE branch, so a PR that edits a test and its hash together still fails.
    # An approved test change carries the PR label `council-unlock`.
    # In a product repo, install the binary instead of building it here (docs/tutorials/04-locked-tests-and-ci.md).
    if: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'council-unlock') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run --locked --release --quiet -- verify-locks --against "origin/${{ github.base_ref }}"
