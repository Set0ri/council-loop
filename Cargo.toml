[package]
name = "council-loop"
version = "0.5.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"            # pick dependency versions that build with rust-version
description = "The Council Loop: a resumable, blind, checked decision process for AI agents. One binary: CLI, MCP server and test-lock hook."
license = "MIT"
# repository = "..."     # set this once the repository has a home
readme = "README.md"
keywords = ["ai", "agents", "llm", "mcp", "cli"]
categories = ["command-line-utilities", "development-tools"]
build = "build.rs"
exclude = ["docs/runs/*", ".council/*", "target/*", ".github/*"]

[[bin]]
name = "council"
path = "src/main.rs"

[lib]
name = "council_loop"
path = "src/lib.rs"

# Whole scenarios through the real binary. It has its own main: it is also the stand-in for the
# vendors' command-line tools that those scenarios call.
[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
harness = false

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
dunce = "1.0.5"
fancy-regex = "0.20"
indexmap = { version = "2", features = ["serde"] }
regex = "1"
regex-syntax = "0.8"
saphyr = "0.3.4"
saphyr-parser = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.10"
sha2 = "0.10"
tree-sitter = "0.26"
tree-sitter-python = "0.25"
ureq = "3"
which = "8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[profile.dev]
debug = 1
