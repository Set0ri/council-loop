[project]
name = "council-loop"
version = "0.1.0"
description = "Council Loop: research-backed looped engineering process, CLI and MCP server"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
mcp = ["mcp[cli]>=1.2"]
dev = ["pytest>=8", "mcp[cli]>=1.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
